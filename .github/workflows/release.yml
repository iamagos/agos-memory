name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build --no-sources
      - name: Test wheel outside the checkout
        run: |
          cd "$(mktemp -d)"
          uv run --python "${{ matrix.python }}" --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            --with "pytest>=8,<10" \
            pytest -q "$GITHUB_WORKSPACE/tests"
      - name: Test source archive outside the checkout
        run: |
          cd "$(mktemp -d)"
          uv run --python "${{ matrix.python }}" --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            --with "pytest>=8,<10" \
            pytest -q "$GITHUB_WORKSPACE/tests"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
      - run: uv python install 3.13
      - name: Verify tag
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build --no-sources
      - name: Record digests
        run: |
          sha256sum dist/* > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - run: uv publish dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
