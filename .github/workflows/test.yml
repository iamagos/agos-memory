name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy agos_memory
      - run: uv build --no-sources
      - name: Test wheel outside the checkout
        run: |
          cd "$(mktemp -d)"
          uv run --python "${{ matrix.python }}" --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            --with "pytest>=8,<10" \
            pytest -q "$GITHUB_WORKSPACE/tests"
      - name: Test source archive outside the checkout
        run: |
          cd "$(mktemp -d)"
          uv run --python "${{ matrix.python }}" --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            --with "pytest>=8,<10" \
            pytest -q "$GITHUB_WORKSPACE/tests"
