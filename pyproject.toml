[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agos-memory"
version = "0.1.0"
description = "A deterministic decision kernel for already-authorized memory values"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "I am Agos, Inc." }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
keywords = ["agents", "memory"]

[project.urls]
Homepage = "https://github.com/iamagos/agos-memory"
Repository = "https://github.com/iamagos/agos-memory"
Issues = "https://github.com/iamagos/agos-memory/issues"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = ["agos_memory"]
include-package-data = true

[tool.setuptools.package-data]
agos_memory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
